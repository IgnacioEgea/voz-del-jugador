# Robot de GitHub: crea data.json con los últimos resultados y publica la carpeta web/ en GitHub Pages.
# Se lanza solo cuando cambia la web o cuando termina una tanda de clasificación.

name: Publicar web
on:
  push:
    branches: [main]
    paths: ["web/**", "src/resumir.py", "src/fechas.py", "src/historial.py", "src/actualizaciones.py", "src/base_datos.py", "sql/**", ".github/workflows/publicar.yml"]
  workflow_run:
    workflows: ["Clasificar reseñas", "Traducir reseñas", "Descargar reseñas"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Si llegan dos publicaciones a la vez, se queda solo la más nueva
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      # Copiamos el repositorio con los datos más recientes
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      # Buscamos la fecha de salida de cada juego en su tienda (si falla, la web sigue sin fechas)
      - run: python src/fechas.py
        continue-on-error: true
      # Y el historial de valoraciones por mes de Steam, para el gráfico de "¿mejora o empeora?"
      - run: python src/historial.py
        continue-on-error: true

      # Y los parches y temporadas anunciados en Steam, para medir su efecto en la valoración
      - run: python src/actualizaciones.py
        continue-on-error: true

      # Resumimos las reseñas en data.json
      - run: python src/resumir.py

      # Base de datos SQLite + consultas de sql/ → CSV para el dashboard (se publican en web/datos/)
      - run: python src/base_datos.py && cp data/voz.db web/datos/voz.db

      # Ponemos una "versión" a los archivos CSS y JS para que los navegadores no usen copias viejas
      - run: sed -i -E "s/\.(css|js)\"/.\1?v=${GITHUB_SHA::7}-${{ github.run_number }}\"/g" web/index.html

      # Subimos la carpeta web/ a GitHub Pages
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: despliegue
        uses: actions/deploy-pages@v4
