# Robot de GitHub: traduce al español las reseñas que se enseñan en la web y guarda la caché de traducciones.
# Se lanza con un botón: "Actions" → "Traducir reseñas" → "Run workflow". Después se publica la web sola.

name: Traducir reseñas
on: workflow_dispatch

permissions:
  contents: write

jobs:
  traducir:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      # Traducimos solo lo que falta; la clave sale de la "caja fuerte" de GitHub
      - run: python src/traducir.py
        env:
          GEMINI_API_KEY: ${{ secrets.API_GEMINI_P1_NACHO }}

      # Guardamos la caché aunque el paso anterior se corte a medias
      - if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/traducciones.json
          git commit -m "Datos: traducciones al español" || echo "Sin cambios"
          git pull --rebase --autostash -q && git push
