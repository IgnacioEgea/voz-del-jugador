# Robot de GitHub: clasifica las reseñas con Gemini y guarda el resultado en el repositorio.
# Se lanza con un botón: "Actions" → "Clasificar reseñas" → "Run workflow".
# Si se acaba la cuota gratuita del día, guarda lo hecho; al relanzarlo, sigue donde lo dejó.

name: Clasificar reseñas
on:
  workflow_dispatch:
    inputs:
      limite:
        description: "Cuántas reseñas clasificar (vacío = todas las que falten)"
        default: ""

permissions:
  contents: write

jobs:
  ia:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      # Copiamos el repositorio e instalamos Python y las librerías
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      # Clasificamos; la clave sale de la "caja fuerte" de GitHub, nunca del código
      # Cada tanda dura como mucho 14 minutos; después se guarda lo hecho
      - run: python src/clasificar.py ${{ inputs.limite }}
        timeout-minutes: 14
        env:
          GEMINI_API_KEY: ${{ secrets.API_GEMINI_P1_NACHO }}

      # Guardamos lo clasificado aunque el paso anterior se corte a medias
      # (antes nos ponemos al día por si alguien ha subido cambios mientras tanto)
      - if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/resenas_clasificadas.csv
          git commit -m "Datos: reseñas clasificadas con IA" || echo "Sin cambios"
          git pull --rebase -q && git push
